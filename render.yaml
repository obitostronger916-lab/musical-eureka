services:
  - type: web
    name: universal-media
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: universal-media-db
          property: connectionString
      - key: APP_NAME
        value: Universal Media
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: universal-media-db
    plan: 0.1c-256mb
    region: singapore
